// =====================================================================
// Baysic Survival Gaming: serverDZ.cfg template (PvE)
//
// This repo is PUBLIC. Keep the CHANGE_ME placeholders here and set the
// real passwords on the server (or in CFTools / Architect) only.
// tools/validate.py fails if a password field holds anything else.
//
// SOURCES
//   [verified] = the setting name is read by Bohemia's own game scripts
//                (github.com/BohemiaInteractive/DayZ-Script-Diff); the
//                file it's read in is noted on the line.
//   [UNVERIFIED] = the server program itself reads it, so it isn't in any
//                public Bohemia repo. Check it against the stock
//                serverDZ.cfg from your server install, or the wiki page
//                community.bistudio.com/wiki/DayZ:Server_Configuration,
//                before relying on it.
//
// Base damage, container damage, personal light, lighting and the respawn
// dialog are set in the mission's cfggameplay.json, not here. Per
// cfggameplayhandler.c, when enableCfgGameplayFile = 1 and the JSON file
// exists, the JSON values are used; otherwise the server falls back to
// reading them from this file.
// =====================================================================

// --- Gameplay file ------------------------------------------------------
enableCfgGameplayFile = 1;              // [verified] cfggameplayhandler.c: load the mission's cfggameplay.json

// --- Identity -----------------------------------------------------------
hostname = "Baysic Survival Gaming | PvE | Chernarus";   // [UNVERIFIED]
password = "";                          // [UNVERIFIED] join password; "" = public
passwordAdmin = "CHANGE_ME";            // [UNVERIFIED] in-game admin login password
description = "PvE: no killing players, no raiding.";    // [UNVERIFIED]

// --- Players & access ---------------------------------------------------
maxPlayers = 60;                        // [UNVERIFIED]
enableWhitelist = 0;                    // [UNVERIFIED]
verifySignatures = 2;                   // [UNVERIFIED]
forceSameBuild = 1;                     // [UNVERIFIED]
BattlEye = 1;                           // [UNVERIFIED]

// --- Voice & view -------------------------------------------------------
disableVoN = 0;                         // [UNVERIFIED]
vonCodecQuality = 20;                   // [UNVERIFIED]
disable3rdPerson = 0;                   // [UNVERIFIED]
disableCrosshair = 0;                   // [UNVERIFIED]

// --- Time ---------------------------------------------------------------
serverTime = "SystemTime";              // [UNVERIFIED]
serverTimeAcceleration = 6;             // [UNVERIFIED]
serverNightTimeAcceleration = 4;        // [UNVERIFIED]
serverTimePersistent = 0;               // [UNVERIFIED]

// --- Persistence --------------------------------------------------------
instanceId = 1;                         // [UNVERIFIED] give every server on the host its own
storageAutoFix = 1;                     // [UNVERIFIED]

// --- Chat messages ------------------------------------------------------
// Timed in-game messages are in the mission's db/messages.xml.
motd[] = {"Welcome to Baysic Survival Gaming (PvE)"};    // [UNVERIFIED]
motdInterval = 600;                     // [UNVERIFIED]

// --- Admin logging (comments from Bohemia's pluginadminlog.c) ------------
adminLogPlayerHitsOnly = 0;             // [verified] 1 - log player hits only / 0 - log all hits (animals/infected)
adminLogPlacement = 1;                  // [verified] 1 - log placement (traps, tents)
adminLogBuildActions = 1;               // [verified] 1 - log basebuilding actions (build, dismantle, destroy)
adminLogPlayerList = 1;                 // [verified] 1 - log periodic player list with position every 5 minutes
enableDebugMonitor = 0;                 // [verified] missionserver.c: on-screen debug monitor

// --- Ports --------------------------------------------------------------
// Ports are left to Architect, which sets them per instance. Check the
// query port setting name against the stock file before adding it here.

// --- Mission ------------------------------------------------------------
class Missions                          // [UNVERIFIED] structure
{
    class DayZ
    {
        // Must match the mission folder name in mpmissions/ (folder name is
        // verified: dayzOffline.chernarusplus in Bohemia's CE repo).
        template = "dayzOffline.chernarusplus";
    };
};
