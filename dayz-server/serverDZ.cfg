// =====================================================================
// Baysic Survival Gaming: serverDZ.cfg template (PvE)
//
// This repo is PUBLIC. Keep the CHANGE_ME placeholders here and set the
// real passwords on the server (or in CFTools / Architect) only.
// tools/validate.py fails if a password field holds anything else.
//
// Gameplay toggles (base damage, container damage, personal light,
// lighting, respawn dialog) live in the mission's cfggameplay.json,
// which overrides the same settings here while enableCfgGameplayFile = 1.
// =====================================================================

// --- Identity -----------------------------------------------------------
hostname = "Baysic Survival Gaming | PvE | Chernarus";
password = "";                          // join password; "" = public server
passwordAdmin = "CHANGE_ME";            // in-game #login password
description = "PvE: no killing players, no raiding. Discord link: see our community page.";

// --- Players & access ---------------------------------------------------
maxPlayers = 60;
enableWhitelist = 0;                    // 1 = only players in whitelist.txt
verifySignatures = 2;                   // only signed mod PBOs may load (keep 2)
forceSameBuild = 1;                     // clients must run the server's exe build
allowFilePatching = 0;                  // keep 0 on a public server
BattlEye = 1;

// --- Voice & view -------------------------------------------------------
disableVoN = 0;
vonCodecQuality = 20;                   // 0-30
disable3rdPerson = 0;
disableCrosshair = 0;

// --- Time ---------------------------------------------------------------
serverTime = "SystemTime";              // or "YYYY/MM/DD/HH/MM"
serverTimeAcceleration = 6;             // 6 = 4-hour in-game day
serverNightTimeAcceleration = 4;        // multiplied on top of the above at night
serverTimePersistent = 0;               // 1 = keep in-game time across restarts

// --- Login queue --------------------------------------------------------
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;

// --- Persistence --------------------------------------------------------
instanceId = 1;                         // must be UNIQUE per server on this host
storageAutoFix = 1;                     // replace corrupted persistence files
storeHouseStateDisabled = false;
lootHistory = 1;

// --- Gameplay -----------------------------------------------------------
enableCfgGameplayFile = 1;              // load cfggameplay.json from the mission
respawnTime = 5;                        // seconds
guaranteedUpdates = 1;

// --- Messages -----------------------------------------------------------
// Most messaging is in db/messages.xml; this rotates in the chat.
motd[] = {"Welcome to Baysic Survival Gaming (PvE)", "Be kind. Help new players. Report problems on Discord."};
motdInterval = 600;                     // seconds between motd lines

// --- Network health warnings -------------------------------------------
maxPing = 300;
pingWarning = 200;
pingCritical = 250;
serverFpsWarning = 15;

// --- Logging ------------------------------------------------------------
timeStampFormat = "Short";
logAverageFps = 1;
logMemory = 1;
logPlayers = 1;
logFile = "server_console.log";
adminLogPlayerHitsOnly = 0;
adminLogPlacement = 1;                  // useful on PvE: who placed what, where
adminLogBuildActions = 1;
adminLogPlayerList = 1;
enableDebugMonitor = 0;

// --- Ports --------------------------------------------------------------
// The game port is set by the launch parameter -port=... (Architect sets it).
// Give every instance its own game port, query port and instanceId.
steamQueryPort = 27016;

// --- Mission --------------------------------------------------------------
class Missions
{
    class DayZ
    {
        // Must match the mission folder name in mpmissions/
        template = "dayzOffline.chernarusplus";
    };
};
