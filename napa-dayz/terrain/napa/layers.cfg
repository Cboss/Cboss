// Napa full map: surface layers for Terrain Builder
// Lives at P:\Napa\source\layers.cfg
// Paths are relative to the P: drive (no "P:\" prefix).
// Mask colours must match gis\napa_surface_mask.py exactly.
//
// Four surfaces, so no Terrain Builder tile can go over the 4-materials-per-tile limit.
// Each .rvmat is a copy of a base-game (no DLC) Chernarus material; its textures stay in DZ\,
// so the grass/undergrowth and footstep sounds come from the vanilla surface definitions.
//
//   napa_grass     = copy of P:\DZ\surfaces\data\terrain\cp_grass.rvmat
//   napa_forest    = copy of P:\DZ\surfaces\data\terrain\cp_broadleaf_sparse1.rvmat
//   napa_dirt      = copy of P:\DZ\surfaces\data\terrain\cp_dirt.rvmat
//   napa_concrete  = copy of P:\DZ\surfaces\data\terrain\cp_concrete1.rvmat

class Layers
{
	// most common surface first
	class napa_grass
	{
		texture = "";
		material = "Napa\data\napa_grass.rvmat";
	};
	class napa_forest
	{
		texture = "";
		material = "Napa\data\napa_forest.rvmat";
	};
	class napa_dirt
	{
		texture = "";
		material = "Napa\data\napa_dirt.rvmat";
	};
	class napa_concrete
	{
		texture = "";
		material = "Napa\data\napa_concrete.rvmat";
	};
};

class Legend
{
	picture = "Napa\source\mapLegend.png";
	class Colors
	{
		napa_grass[] = {{0,255,0}};
		napa_forest[] = {{0,110,0}};
		napa_dirt[] = {{150,100,50}};
		napa_concrete[] = {{128,128,128}};
	};
};
