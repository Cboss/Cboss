// Napa test patch: surface layers for Terrain Builder
// Copy to P:\NapaPilot\source\layers.cfg
// Paths are relative to the P: drive (no "P:\" prefix).
// Starter version: one surface (grass) so the mapframe can be saved.
// Vineyard, dry hillside, asphalt etc. get added once the vanilla
// surface list (surfaces.txt) confirms which materials to copy.

class Layers
{
	class napa_grass
	{
		texture = "";
		material = "NapaPilot\data\napa_grass.rvmat";
	};
};

class Legend
{
	picture = "NapaPilot\source\mapLegend.png";
	class Colors
	{
		// Surface mask color (R,G,B) for each layer
		napa_grass[] = {{0,255,0}};
	};
};
